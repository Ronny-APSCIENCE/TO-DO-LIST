<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 My Tasks</h1>
            <p class="date" id="currentDate"></p>
        </header>

        <div class="add-task-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="taskTitle" 
                    placeholder="Add a new task..." 
                    class="task-input"
                >
                <input 
                    type="date" 
                    id="taskDate" 
                    class="task-date"
                >
                <button onclick="addTask()" class="btn-add">+</button>
            </div>
            <textarea 
                id="taskDescription" 
                placeholder="Add description (optional)" 
                class="task-description"
            ></textarea>
        </div>

        <div class="tasks-container">
            <section class="task-section">
                <h2 class="section-title">
                    <span class="icon">☀️</span> Today
                </h2>
                <div id="todayTasks" class="tasks-list"></div>
            </section>

            <section class="task-section">
                <h2 class="section-title">
                    <span class="icon">🌙</span> Tomorrow
                </h2>
                <div id="tomorrowTasks" class="tasks-list"></div>
            </section>

            <section class="task-section">
                <h2 class="section-title">
                    <span class="icon">📅</span> Upcoming
                </h2>
                <div id="upcomingTasks" class="tasks-list"></div>
            </section>

            <section class="task-section">
                <h2 class="section-title">
                    <span class="icon">✅</span> Completed
                </h2>
                <div id="completedTasks" class="tasks-list"></div>
            </section>
        </div>
    </div>

    <script>
        // Set current date
        function updateDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const today = new Date();
            document.getElementById('currentDate').textContent = today.toLocaleDateString('en-US', options);
        }

        // Load tasks from API
        async function loadTasks() {
            try {
                const response = await fetch('/api/tasks');
                const tasks = await response.json();
                
                renderTasks('todayTasks', tasks.today);
                renderTasks('tomorrowTasks', tasks.tomorrow);
                renderTasks('upcomingTasks', tasks.upcoming);
                renderTasks('completedTasks', tasks.completed);
            } catch (error) {
                console.error('Error loading tasks:', error);
            }
        }

        // Render tasks in a section
        function renderTasks(containerId, tasks) {
            const container = document.getElementById(containerId);
            
            if (tasks.length === 0) {
                container.innerHTML = '<p class="empty-message">No tasks yet</p>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="task-item ${task.completed ? 'completed' : ''}">
                    <div class="task-header">
                        <input 
                            type="checkbox" 
                            class="task-checkbox" 
                            ${task.completed ? 'checked' : ''}
                            onchange="toggleTask(${task.id}, this.checked)"
                        >
                        <span class="task-title">${escapeHtml(task.title)}</span>
                        <span class="task-date-badge">${formatDate(task.due_date)}</span>
                    </div>
                    ${task.description ? `<p class="task-description-display">${escapeHtml(task.description)}</p>` : ''}
                    <div class="task-actions">
                        <button class="btn-icon" onclick="editTask(${task.id})">✏️</button>
                        <button class="btn-icon" onclick="deleteTask(${task.id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        // Add new task
        async function addTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const description = document.getElementById('taskDescription').value.trim();
            const dueDate = document.getElementById('taskDate').value;

            if (!title) {
                alert('Please enter a task title');
                return;
            }

            try {
                const response = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title,
                        description,
                        due_date: dueDate
                    })
                });

                if (response.ok) {
                    document.getElementById('taskTitle').value = '';
                    document.getElementById('taskDescription').value = '';
                    document.getElementById('taskDate').value = '';
                    loadTasks();
                }
            } catch (error) {
                console.error('Error adding task:', error);
            }
        }

        // Toggle task completion
        async function toggleTask(taskId, completed) {
            try {
                await fetch(`/api/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ completed: completed ? 1 : 0 })
                });
                loadTasks();
            } catch (error) {
                console.error('Error updating task:', error);
            }
        }

        // Delete task
        async function deleteTask(taskId) {
            if (confirm('Are you sure you want to delete this task?')) {
                try {
                    await fetch(`/api/tasks/${taskId}`, {
                        method: 'DELETE'
                    });
                    loadTasks();
                } catch (error) {
                    console.error('Error deleting task:', error);
                }
            }
        }

        // Edit task (placeholder - can be enhanced)
        function editTask(taskId) {
            alert('Edit functionality coming soon! You can delete and recreate the task for now.');
        }

        // Format date
        function formatDate(dateStr) {
            if (!dateStr) return 'No date';
            const date = new Date(dateStr + 'T00:00:00');
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            if (date.toDateString() === today.toDateString()) return 'Today';
            if (date.toDateString() === tomorrow.toDateString()) return 'Tomorrow';
            
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        // Escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Handle Enter key
        document.addEventListener('DOMContentLoaded', function() {
            updateDate();
            loadTasks();

            document.getElementById('taskTitle').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTask();
                }
            });

            document.getElementById('taskDescription').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && e.ctrlKey) {
                    addTask();
                }
            });

            // Auto-refresh tasks every 30 seconds
            setInterval(loadTasks, 30000);
        });
    </script>
</body>
</html>
